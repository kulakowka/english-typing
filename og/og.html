<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#18181a;color:#f2efe8;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;right:-200px;top:-200px;width:700px;height:700px;background:radial-gradient(#7ee0a822,transparent 65%)}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.logo{font:700 34px 'JetBrains Mono',monospace}.logo span{color:#7ee0a8}
h1{font:800 62px/1.05 Inter;margin:34px 0 0;letter-spacing:-1.5px;max-width:560px}
h1 em{font-style:normal;color:#7ee0a8}
p{font:500 24px/1.4 Inter;color:#a5a29a;margin:18px 0 0;max-width:545px}
.url{margin-top:auto;font:700 26px 'JetBrains Mono',monospace;color:#7ee0a8}
.ed{position:absolute;right:64px;top:150px;width:500px;background:#212124;border:1px solid #34343a;border-radius:18px;box-shadow:0 30px 80px #0008}
.tb{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid #34343a;font:15px 'JetBrains Mono';color:#8a877f;align-items:center}
.tb b{font-weight:400;color:#f2efe8}
.tb .pips{margin-left:auto;display:flex;gap:4px}.tb .pips i{width:16px;height:6px;border-radius:3px;background:#ffffff14}.tb .pips i.on{background:#7ee0a8}
.bd{padding:26px 24px 24px;display:grid;grid-template-columns:auto 1fr;gap:16px 14px;align-items:baseline}
.tag{font:700 11px 'JetBrains Mono';border:1px solid #ffffff22;border-radius:4px;padding:2px 5px;color:#8a877f}
.tag.en{color:#7ee0a8;border-color:#7ee0a855}
.ru{font:500 25px/1.3 Inter}
.line{font:600 25px/1.5 'JetBrains Mono',monospace;white-space:pre;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.sl{color:#ffffff42}
.bad{position:relative;display:inline-block;width:1ch;background:#ff5f5633;border-radius:3px;border-left:3px solid #7ee0a8;margin-left:-3px}
.badge{position:absolute;left:50%;top:-26px;transform:translateX(-50%);background:#ff5f56;color:#fff;font:700 14px/1 'JetBrains Mono';padding:4px 6px;border-radius:5px}
.msg{grid-column:2;font:500 18px/1.4 Inter;color:#ffd23f}
.msg b{font-weight:700}
.stats{position:absolute;right:64px;top:520px;width:500px;display:flex;gap:34px;font:700 34px 'JetBrains Mono';color:#7ee0a8}
.stats span{display:block;font:500 13px Inter;color:#8a877f;letter-spacing:.08em;margin-top:2px}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="logo">english<span>_</span>typing</div>
  <h1>Английские фразы <em>по памяти</em></h1>
  <p>Видишь по-русски, печатаешь по-английски.<br>Ошибки возвращаются завтра.</p>
  <div class="url">english.antonkulakov.com</div>
</div>
<div class="ed">
  <div class="tb"><b>разговор</b><span>· повтор</span><span class="pips"><i class="on"></i><i></i><i></i><i></i><i></i></span></div>
  <div class="bd">
    <span class="tag">RU</span><div class="ru">Это зависит от погоды.</div>
    <span class="tag en">EN</span><div class="line">It depends <span class="bad"><span class="badge">f</span> </span><span class="sl">_ ___ _______.</span></div>
    <div class="msg">«Зависит от» = depends <b>on</b>. Не from и не of.</div>
  </div>
</div>
<div class="stats"><div>4/6<span>ПО ПАМЯТИ</span></div><div>97%<span>ТОЧНОСТЬ</span></div><div>5 дней<span>СЕРИЯ</span></div></div>
</body></html>
